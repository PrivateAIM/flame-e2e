name: typecheck

# Compiles the test code only. The E2E run itself is NOT executed here:
# it needs staging credentials and network access to the nodes.
on:
  push:
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
